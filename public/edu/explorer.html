<script>(() => {

const icons = {
    doc: '󰧮',
    ppt: '󰐩',
    pen: '',
    ext: '',
    dir: '',
    dirOpen: '',
    left: '',
};

const basiDati = [
    {
        name: 'Modello concettuale e logico',
        url: '/edu/basi-dati/modello-concettuale-e-logico.html'
    },
    {
        name: 'Persistenza: file system e DBMS',
        url: '/edu/basi-dati/filesystem-vs-dbms.html'
    },
    {
        name: 'Chiavi e dipendenze funzionali',
        url: '/edu/basi-dati/chiavi-e-dipendenze.html'
    },
    {
        name: 'Le forme normali',
        url: '/edu/basi-dati/forme-normali.html'
    },
    {
        name: 'Algebra relazionale',
        content: [
            {
                name: 'Teoria',
                url: '/edu/basi-dati/algebra-relazionale.html'
            },
            {
                name: 'Esercizi',
                icon: icons.pen,
                url: '/edu/basi-dati/algebra-relazionale-esercizi.html'
            },
        ]
    }
];

const webApp = [
    {
        name: 'Sistemi distribuiti',
        url: '/edu/webapp/sistemi-distribuiti.html'
    },
    {
        name: 'Le applicazioni web',
        icon: icons.ppt,
        url: 'https://docs.google.com/presentation/d/14nNV28D-ktGTRXgYpn-6kJD7fPNWQ3VTTAOxdqPZNEw/edit?usp=drive_link'
    },
    {
        name: 'HTTP ed altri protocolli del web',
        icon: icons.ppt,
        url: 'https://docs.google.com/presentation/d/1cnBzWwU7da8rIEnIwLYyRC3ddKbUZS5rx-Tgq6wFocA/edit?usp=drive_link'
    },
    {
        name: 'Paradigmi di comunicazione',
        url: '/edu/webapp/paradigmi-di-comunicazione.html'
    },
    {
        name: 'REST e SOAP',
        url: '/edu/webapp/rest-e-soap.html'
    },
];

const items = [
    {
        name: 'Basi di dati',
        content: basiDati,
    },
    {
        name: 'Applicazioni web',
        content: webApp,
    },
    {
        name: 'Git',
        content: [
            {
                name: 'Manuale',
                url: '/edu/manuale-git.html'
            }
        ],
    },
];

const explorer = document.getElementById('edu-explorer');
if (explorer) {
    const tab = explorer.querySelector('.edu-explorer__tab');
    const panel = explorer.querySelector('.edu-explorer__panel');
    const tree = explorer.querySelector('.edu-explorer__tree');
    const tabIcon = tab.querySelector('.edu-explorer__tab-icon');

    const isExternal = (url) => /^https?:\/\//i.test(url);

    const currentPath = window.location.pathname;

    const isCurrent = (item) => {
        if (item.url) return item.url === currentPath;
        if (item.content) return item.content.some(isCurrent);
        return false;
    };

    const renderLink = (item) => {
        const li = document.createElement('li');

        const link = document.createElement('a');
        link.className = 'edu-explorer__link';
        link.href = item.url;

        if (item.url === currentPath) {
            link.classList.add('edu-explorer__link--current');
        }

        const external = isExternal(item.url);
        if (external) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
        }

        const icon = document.createElement('span');
        icon.className = 'edu-explorer__icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = item.icon || icons.doc;

        const name = document.createElement('span');
        name.className = 'edu-explorer__name';
        name.textContent = item.name;

        link.append(icon, name);

        if (external) {
            const ext = document.createElement('span');
            ext.className = 'edu-explorer__ext';
            ext.setAttribute('aria-hidden', 'true');
            ext.textContent = icons.ext;
            ext.title = 'Apre in una nuova scheda';
            link.append(ext);
        }

        li.append(link);
        return li;
    };

    const renderFolder = (item) => {
        const li = document.createElement('li');
        li.className = 'edu-explorer__folder';

        const open = isCurrent(item);
        li.classList.toggle('is-collapsed', !open);

        const head = document.createElement('button');
        head.type = 'button';
        head.className = 'edu-explorer__folder-head';
        head.setAttribute('aria-expanded', String(open));

        const folderIcon = document.createElement('span');
        folderIcon.className = 'edu-explorer__folder-icon';
        folderIcon.setAttribute('aria-hidden', 'true');
        folderIcon.textContent = open ? icons.dirOpen : icons.dir;

        const folderName = document.createElement('span');
        folderName.className = 'edu-explorer__folder-name';
        folderName.textContent = item.name;

        head.append(folderIcon, folderName);

        const children = document.createElement('ul');
        children.className = 'edu-explorer__items';
        for (const child of item.content) {
            children.append(renderItem(child));
        }

        head.addEventListener('click', () => {
            const collapsed = head.getAttribute('aria-expanded') === 'true';
            head.setAttribute('aria-expanded', String(!collapsed));
            li.classList.toggle('is-collapsed', collapsed);
            folderIcon.textContent = collapsed ? icons.dir : icons.dirOpen;
        });

        li.append(head, children);
        return li;
    };

    const renderItem = (item) => item.content ? renderFolder(item) : renderLink(item);

    for (const item of items) {
        tree.append(renderItem(item));
    }

    const setOpen = (open) => {
        explorer.dataset.open = String(open);
        tab.setAttribute('aria-expanded', String(open));
        panel.setAttribute('aria-hidden', String(!open));
        tab.setAttribute('aria-label', open ? 'Chiudi esplora file' : 'Apri esplora file');
        tabIcon.textContent = open ? icons.left : icons.dir;
    };

    tab.addEventListener('click', () => {
        setOpen(explorer.dataset.open !== 'true');
    });
}

})();</script>


<div class="edu-explorer" id="edu-explorer" data-open="false">
    <button type="button" class="edu-explorer__tab" aria-controls="edu-explorer-panel" aria-expanded="false" aria-label="Apri esplora file">
        <span class="edu-explorer__tab-icon" aria-hidden="true">&#xF024B;</span>
    </button>
    <aside class="edu-explorer__panel" id="edu-explorer-panel" aria-hidden="true">
        <nav class="edu-explorer__nav">
            <ul class="edu-explorer__tree" id="edu-explorer-tree"></ul>
        </nav>
    </aside>
</div>
