<script>(() => {

const icons = {
    doc: '󰧮',
    ppt: '󰐩',
    pen: '',
    ext: '',
    dir: '',
    dirOpen: '',
    left: '',
};

const basiDati = [
    {
        name: 'Modello concettuale e logico',
        url: '/edu/basi-dati/modello-concettuale-e-logico.html'
    },
    {
        name: 'Persistenza: file system e DBMS',
        url: '/edu/basi-dati/filesystem-vs-dbms.html'
    },
    {
        name: 'Chiavi e dipendenze funzionali',
        url: '/edu/basi-dati/chiavi-e-dipendenze.html'
    },
    {
        name: 'Le forme normali',
        content: [
            {
                name: 'Teoria',
                url: '/edu/basi-dati/forme-normali.html'
            },
            {
                name: 'Esercizi',
                icon: icons.pen,
                url: '/edu/basi-dati/forme-normali-es.html'
            }
        ],
    },
    {
        name: 'Algebra relazionale',
        content: [
            {
                name: 'Teoria',
                url: '/edu/basi-dati/algebra-relazionale.html'
            },
            {
                name: 'Esercizi',
                icon: icons.pen,
                url: '/edu/basi-dati/algebra-relazionale-es.html'
            },
        ]
    }
];

const webApp = [
    {
        name: 'Sistemi distribuiti',
        url: '/edu/webapp/sistemi-distribuiti.html'
    },
    {
        name: 'Le applicazioni web',
        icon: icons.ppt,
        url: 'https://docs.google.com/presentation/d/14nNV28D-ktGTRXgYpn-6kJD7fPNWQ3VTTAOxdqPZNEw/edit?usp=drive_link'
    },
    {
        name: 'HTTP ed altri protocolli del web',
        icon: icons.ppt,
        url: 'https://docs.google.com/presentation/d/1cnBzWwU7da8rIEnIwLYyRC3ddKbUZS5rx-Tgq6wFocA/edit?usp=drive_link'
    },
    {
        name: 'Paradigmi di comunicazione',
        url: '/edu/webapp/paradigmi-di-comunicazione.html'
    },
    {
        name: 'REST e SOAP',
        url: '/edu/webapp/rest-e-soap.html'
    },
    {
        name: 'Architettura webapp',
        content: [
            {
                name: 'E-commerce',
                url: '/edu/webapp/es-architettura/ecommerce.html',
                icon: icons.pen,
            },
            {
                name: 'Editing documenti collaborativo',
                url: '/edu/webapp/es-architettura/editing-documenti.html',
                icon: icons.pen,
            },
            {
                name: 'Applicazione IoT',
                url: '/edu/webapp/es-architettura/app-iot.html',
                icon: icons.pen,
            },
        ]
    }
];

const items = [
    {
        name: 'Basi di dati',
        content: basiDati,
    },
    {
        name: 'Applicazioni web',
        content: webApp,
    },
    {
        name: 'Git',
        content: [
            {
                name: 'Manuale',
                url: '/edu/manuale-git.html'
            }
        ],
    },
];

const explorer = document.getElementById('edu-explorer');
if (explorer) {
    const panel = explorer.querySelector('.panel');
    const tree = explorer.querySelector('.tree');
    const breadcrumbs = explorer.querySelector('.breadcrumbs');
    const topbarIcon = explorer.querySelector('.topbar-icon');
    const closeButton = explorer.querySelector('.close');
    const toggleButton = explorer.querySelector('.topbar-toggle');

    const isExternal = (url) => /^https?:\/\//i.test(url);

    const currentPath = window.location.pathname;

    const findItem = (list, predicate) => {
        for (const item of list) {
            if (predicate(item)) return item;
            if (item.content) {
                const found = findItem(item.content, predicate);
                if (found) return found;
            }
        }
        return null;
    };

    const getPathItems = (list, target, trail = []) => {
        for (const item of list) {
            if (item === target) return [...trail, item];
            if (item.content) {
                const sub = getPathItems(item.content, target, [...trail, item]);
                if (sub) return sub;
            }
        }
        return null;
    };

    const getOpenFolders = (list, target, trail = []) => {
        for (const item of list) {
            if (item === target) {
                return item.content ? [...trail, item] : trail;
            }
            if (item.content) {
                const sub = getOpenFolders(item.content, target, [...trail, item]);
                if (sub) return sub;
            }
        }
        return null;
    };

    const currentItem = findItem(items, (item) => item.url === currentPath);
    let openFolders = new Set(currentItem ? getOpenFolders(items, currentItem) : []);

    const renderBreadcrumbs = () => {
        breadcrumbs.textContent = '';
        const pathItems = currentItem ? getPathItems(items, currentItem) : [];
        for (let i = 0; i < pathItems.length; i++) {
            const item = pathItems[i];

            const crumb = document.createElement('button');
            crumb.type = 'button';
            crumb.className = 'crumb';
            crumb.textContent = item.name;
            crumb.addEventListener('click', () => {
                openFolders = new Set(getOpenFolders(items, item));
                renderTree();
                setOpen(true);
            });
            breadcrumbs.append(crumb);

            if (i < pathItems.length - 1) {
                const sep = document.createElement('span');
                sep.className = 'crumb-sep';
                sep.setAttribute('aria-hidden', 'true');
                sep.textContent = '/';
                breadcrumbs.append(sep);
            }
        }
    };

    renderBreadcrumbs();

    const renderLink = (item) => {
        const li = document.createElement('li');

        const link = document.createElement('a');
        link.className = 'link';
        link.href = item.url;

        if (item.url === currentPath) {
            link.classList.add('current');
        }

        const external = isExternal(item.url);
        if (external) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
        }

        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = item.icon || icons.doc;

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = item.name;

        link.append(icon, name);

        if (external) {
            const ext = document.createElement('span');
            ext.className = 'ext';
            ext.setAttribute('aria-hidden', 'true');
            ext.textContent = icons.ext;
            ext.title = 'Apre in una nuova scheda';
            link.append(ext);
        }

        li.append(link);
        return li;
    };

    const renderFolder = (item) => {
        const li = document.createElement('li');
        li.className = 'folder';

        const open = openFolders.has(item);
        li.classList.toggle('collapsed', !open);

        const head = document.createElement('button');
        head.type = 'button';
        head.className = 'folder-head';
        head.setAttribute('aria-expanded', String(open));

        const folderIcon = document.createElement('span');
        folderIcon.className = 'folder-icon';
        folderIcon.setAttribute('aria-hidden', 'true');
        folderIcon.textContent = open ? icons.dirOpen : icons.dir;

        const folderName = document.createElement('span');
        folderName.className = 'folder-name';
        folderName.textContent = item.name;

        head.append(folderIcon, folderName);

        const children = document.createElement('ul');
        children.className = 'items';
        for (const child of item.content) {
            children.append(renderItem(child));
        }

        head.addEventListener('click', () => {
            const collapsed = head.getAttribute('aria-expanded') === 'true';
            head.setAttribute('aria-expanded', String(!collapsed));
            li.classList.toggle('collapsed', collapsed);
            folderIcon.textContent = collapsed ? icons.dir : icons.dirOpen;
        });

        li.append(head, children);
        return li;
    };

    const renderItem = (item) => item.content ? renderFolder(item) : renderLink(item);

    const renderTree = () => {
        tree.textContent = '';
        for (const item of items) {
            tree.append(renderItem(item));
        }
    };

    renderTree();

    const setOpen = (open) => {
        explorer.dataset.open = String(open);
        panel.setAttribute('aria-hidden', String(!open));
        toggleButton.setAttribute('aria-expanded', String(open));
        topbarIcon.textContent = open ? icons.dirOpen : icons.dir;
    };

    topbarIcon.textContent = icons.dir;

    toggleButton.addEventListener('click', () => {
        setOpen(explorer.dataset.open !== 'true');
    });

    closeButton.addEventListener('click', () => {
        setOpen(false);
    });

    document.addEventListener('click', (event) => {
        if (explorer.dataset.open === 'true' && !explorer.contains(event.target)) {
            setOpen(false);
        }
    });
}

})();</script>


<div class="edu-explorer" id="edu-explorer" data-open="false">
    <div class="topbar-spacing"></div>
    <header class="topbar">
        <button type="button" class="topbar-toggle" aria-expanded="false" aria-label="Mostra o nascondi esplora file">
            <span class="topbar-icon" aria-hidden="true"></span>
        </button>
        <nav class="breadcrumbs" aria-label="Percorso"></nav>
    </header>
    <aside class="panel" id="edu-explorer-panel" aria-hidden="true">
        <div class="panel-head">
        </div>
        <nav class="nav">
            <button type="button" class="close" aria-label="Chiudi esplora file">
                <span class="close-icon" aria-hidden="true">&#xF0156;</span>
            </button>
            <ul class="tree" id="edu-explorer-tree"></ul>
        </nav>
    </aside>
</div>
