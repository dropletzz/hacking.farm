<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Ruota</title>

<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="./style.css">
<script defer type="text/javascript" src="./script.js"></script>

</head>

<body>
    <header class="topbar">
        <nav class="actions">
            <button id="download-png" type="button">Esporta png</button>
            <button id="save-file" type="button">Salva</button>
            <button id="load-file" type="button">Carica</button>
            <input id="load-file-input" type="file" accept=".json,application/json" hidden>
            <button id="reset" type="button">Reset</button>
        </nav>
    </header>

    <div class="layout">
        <aside class="panel">
            <h2>Dimensioni</h2>
            <button id="add-dimension-top" type="button">+ Dimensione</button>
            <div id="dimensions-list"></div>
            <button id="add-dimension" type="button">+ Dimensione</button>
        </aside>

        <main class="canvas-wrap">
            <canvas id="wheel"></canvas>
        </main>
    </div>
</body>

</html>
